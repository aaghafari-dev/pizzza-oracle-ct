name: 🍕 Continuous Training

on:
  workflow_dispatch:        # manual trigger (our main tool today)
  schedule:
    - cron: "0 7 * * *"     # every day at 07:00 UTC — the Oracle wakes before the pizzeria

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CT pipeline
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          BUCKET: pizza-oracle-ali
        run: python ct_pipeline.py | tee run_output.txt

      - name: Publish run summary
        run: |
          echo "## 🍕 Pizza Oracle CT Run" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat run_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY